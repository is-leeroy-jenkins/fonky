name: Verify arXiv fetcher integration

on:
  pull_request:
    paths:
      - "fetchers.py"
      - "tests/test_arxiv_integration.py"
      - ".github/workflows/test-arxiv-integration.yml"
  workflow_dispatch:
    inputs:
      live:
        description: "Run one real arXiv API query"
        required: false
        default: false
        type: boolean

jobs:
  arxiv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependencies
        run: |
          python -m pip install pytest "langchain-community==0.4.2" "arxiv>=2.1,<3" pymupdf
      - name: Compile and test the unmodified ArXiv fetcher
        run: |
          python -m py_compile fetchers.py
          python -m pytest -q tests/test_arxiv_integration.py
      - name: Optional live smoke query
        if: github.event_name == 'pull_request' || inputs.live == true
        continue-on-error: true
        env:
          FONKY_ARXIV_LIVE: "1"
        run: python -m pytest -q tests/test_arxiv_integration.py -k live
