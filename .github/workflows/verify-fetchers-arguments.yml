name: Temporary fetcher argument verification

on:
  push:
    paths:
      - 'fetchers.py'
      - '.github/workflows/verify-fetchers-arguments.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile entire source
        run: python -m py_compile fetchers.py
      - name: Verify source structure and argument contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('fetchers.py').read_text(encoding='utf-8')
          tree = ast.parse(source, filename='fetchers.py')
          classes = [node for node in tree.body if isinstance(node, ast.ClassDef)]
          methods = [
              node for cls in classes for node in cls.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          assert len(classes) == 49, len(classes)
          assert len(methods) == 513, len(methods)
          assert source.count('exception.method =') == 404
          bad = []
          for method in methods:
              all_params = method.args.posonlyargs + method.args.args
              num_defaulted = len(method.args.defaults)
              defaulted = {arg.arg for arg in all_params[-num_defaulted:]} if num_defaulted else set()
              defaulted.update(arg.arg for arg, val in zip(method.args.kwonlyargs, method.args.kw_defaults) if val is not None)
              for call in ast.walk(method):
                  if not isinstance(call, ast.Call) or not isinstance(call.func, ast.Name) or call.func.id != 'throw_if':
                      continue
                  if len(call.args) < 2 or not isinstance(call.args[1], ast.Name):
                      continue
                  if call.args[1].id in defaulted:
                      bad.append((method.name, call.args[1].id, call.lineno))
          assert not bad, f'Default arguments incorrectly guarded: {bad[:15]}'
          print('Verified', len(classes), 'classes,', len(methods), 'methods and 404 exception metadata assignments.')
          PY
