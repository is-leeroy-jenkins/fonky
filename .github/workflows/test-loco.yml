name: Local automation tests

on:
  pull_request:
    paths:
      - 'loco.py'
      - 'tests/test_loco.py'
      - 'pyproject.toml'
      - '.github/workflows/test-loco.yml'
  push:
    branches:
      - 'feature/loco-local-automation'
    paths:
      - 'loco.py'
      - 'tests/test_loco.py'
      - 'pyproject.toml'
      - '.github/workflows/test-loco.yml'

jobs:
  local-automation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused test dependencies
        run: python -m pip install "openpyxl>=3.1,<4" "python-docx" "python-pptx>=1.0,<2"

      - name: Check module syntax
        run: python -m py_compile loco.py tests/test_loco.py

      - name: test_file_lifecycle
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_file_lifecycle -v
      - name: test_boundary_and_archive
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_boundary_and_archive -v
      - name: test_transactions_and_backup
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_transactions_and_backup -v
      - name: test_readonly_database
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_readonly_database -v
      - name: test_arithmetic
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_arithmetic -v
      - name: test_allowlist
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_allowlist -v
      - name: test_excel
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_excel -v
      - name: test_word
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_word -v
      - name: test_powerpoint
        if: always()
        run: python -m unittest discover -s tests -p test_loco.py -k test_powerpoint -v
