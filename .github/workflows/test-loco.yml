name: Local automation tests

on:
  pull_request:
    paths:
      - 'loco.py'
      - 'tests/test_loco.py'
      - 'pyproject.toml'
      - '.github/workflows/test-loco.yml'
  push:
    branches:
      - 'feature/loco-local-automation'
    paths:
      - 'loco.py'
      - 'tests/test_loco.py'
      - 'pyproject.toml'
      - '.github/workflows/test-loco.yml'

jobs:
  local-automation:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install focused test dependencies
        run: python -m pip install "openpyxl>=3.1,<4" "python-docx" "python-pptx>=1.0,<2"

      - name: Check module syntax
        run: python -m py_compile loco.py tests/test_loco.py

      - name: Run local regression tests
        run: python -m unittest discover -s tests -p test_loco.py -v
