name: Temporary fetcher API regression verification
on:
  push:
    paths:
      - '.github/workflows/verify-fetcher-api.yml'
      - 'fetchers.py'
permissions:
  contents: read
jobs:
  api-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch unchanged pre-refactor reference
        run: git fetch --depth=1 origin c813b5bfae76c9087da825a52a0cff2b25c4b05b
      - name: Compile current implementation
        run: python -m py_compile fetchers.py
      - name: Execute mocked HTTP and behavior-differential tests
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          import subprocess
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import Mock
          
          BASE = "c813b5bfae76c9087da825a52a0cff2b25c4b05b"
          before = subprocess.check_output(["git", "show", BASE + ":fetchers.py"], text=True)
          after = Path("fetchers.py").read_text(encoding="utf-8")
          assert len(re.findall(r"^class ", before, re.M)) == len(re.findall(r"^class ", after, re.M)) == 49
          assert len(re.findall(r"^\tdef ", before, re.M)) == len(re.findall(r"^\tdef ", after, re.M)) == 513
          assert before.count("exception.method =") == after.count("exception.method =") == 404
          assert before.count("requests.get(") == after.count("requests.get(")
          assert before.count("requests.post(") == after.count("requests.post(")
          assert before.count("requests.put(") == after.count("requests.put(")
          ast.parse(after)
          
          def method(source: str, cls: str, name: str) -> str:
              lines = source.splitlines(keepends=True)
              marker = re.compile(r"^class " + re.escape(cls) + r"\s*\(")
              start = next(i for i, line in enumerate(lines) if marker.match(line))
              stop = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("class ")), len(lines))
              first = next(i for i in range(start + 1, stop) if lines[i].startswith("\tdef " + name + "("))
              last = next((i for i in range(first + 1, stop) if lines[i].startswith("\tdef ")), stop)
              return "".join(lines[first:last])
          
          class WrappedError(Exception):
              def __init__(self, cause):
                  super().__init__(str(cause))
                  self.exception = cause
          
          def throw_if(name, value):
              if value is None or isinstance(value, str) and not value.strip():
                  raise ValueError(name)
              if isinstance(value, (tuple,list,set,dict)) and not value:
                  raise ValueError(name)
          
          class ResponseResult:
              def __init__(self, response):
                  self.response = response
          
          class FakeSoup:
              def __init__(self, html, parser):
                  self.html = html
          
          requests = SimpleNamespace(get=Mock())
          scope = {"requests": requests,"Error": WrappedError,"throw_if": throw_if,
                   "Result":ResponseResult,"BeautifulSoup":FakeSoup,
                   "re":re,"urllib":__import__("urllib"),"Dict":dict,"List":list,
                   "Any":object,"Optional":object,"Tuple":tuple}
          def build(source, cls, name):
              method_src = method(source, cls, name)
              expression = "from __future__ import annotations\nclass Target:\n" + method_src
              env = dict(scope)
              exec(compile(expression, f"{cls}.{name}", "exec"), env)
              return env["Target"]
          
          def exercise_web(source):
              obj=build(source,"WebFetcher","fetch")()
              obj.headers={"User-Agent":"test"}
              response=Mock()
              response.text="<h1>ok</h1>"
              requests.get.reset_mock()
              requests.get.return_value=response
              result=obj.fetch(url="https://example.org/data",time=8)
              assert result.response is response
              assert obj.url=="https://example.org/data"
              assert obj.timeout==8
              assert obj.html=="<h1>ok</h1>"
              assert requests.get.call_args.kwargs["timeout"]==8
              assert requests.get.call_args.kwargs["url"]=="https://example.org/data"
              with __import__("unittest").TestCase().assertRaises(WrappedError):
                  obj.fetch(url="")
              return (obj.url,obj.timeout)
          
          def exercise_links(source,html,base_url):
              obj=build(source,"StarMap","extract_links")()
              try:
                  outcome=obj.extract_links(html=html,base_url=base_url)
                  return ("success",outcome)
              except Exception as exc:
                  return ("error",type(exc).__name__,type(getattr(exc,"exception",None)).__name__)
          
          assert exercise_web(before)==exercise_web(after)
          print("PASS WebFetcher mocked HTTP request, normalized result, failure metadata")
          for html,base_url in [("", ""),("", "https://example.org"),("<a href='/foo'>png</a>","https://example.org")]:
              a=exercise_links(before,html,base_url)
              b=exercise_links(after,html,base_url)
              print("StarMap.extract_links",repr(html),repr(base_url),"BEFORE",a,"AFTER",b)
              assert a==b, "REGRESSION: StarMap.extract_links changed"
          print("PASS equivalent sampled behavior and API-request call counts")
          



          # Execute real method bodies with deterministic HTTP mocks across providers.
          # Original source has malformed metadata literals in some methods. The test
          # normalizes only the diagnostic string at compile time; it does not edit the repo.
          def build_safe(source, cls, name):
              src = method(source, cls, name)
              src = re.sub(r"^(\t+exception\.method\s*=).*$",
                           r"\1 'diagnostic'",src,flags=re.M)
              env = dict(scope)
              exec(compile("from __future__ import annotations\nclass Target:\n"+src,
                           cls+"."+name,"exec"),env)
              return env["Target"]

          def check_maps(source):
              obj=build_safe(source,"GoogleMaps","geocode_location")()
              obj.api_key="test-key"
              obj.headers={}
              obj.timeout=11
              response=Mock()
              response.json.return_value={
                  "status":"OK","results":[{"geometry":{"location":{
                      "lat":38.8799,"lng":-77.1068}}}]}
              requests.get.reset_mock()
              requests.get.return_value=response
              coordinates=obj.geocode_location("Arlington, VA")
              assert coordinates==(38.8799,-77.1068)
              assert obj.coordinates==coordinates
              opts=requests.get.call_args.kwargs
              assert opts["params"]=={"address":"Arlington, VA","key":"test-key"}
              assert opts["timeout"]==11
              return coordinates,opts["url"],opts["params"],opts["timeout"]

          def check_usno(source):
              obj=build_safe(source,"NavalObservatory","fetch_celnav")()
              obj.base_url="https://aa.usno.navy.mil/api"
              obj.headers={"User-Agent":"test"}
              obj.validate_date=lambda x:x
              obj.validate_time=lambda x:x
              obj.validate_coordinates=lambda latitude,longitude:(latitude,longitude)
              response=Mock()
              response.json.return_value={"type":"Feature","properties":{"data":[]}}
              requests.get.reset_mock()
              requests.get.return_value=response
              result=obj.fetch_celnav("2026-11-08","15:03",38.9,-77.0,time=12)
              assert result["mode"]=="celnav"
              assert result["data"]==response.json.return_value
              options=requests.get.call_args.kwargs
              assert options["params"]=={"date":"2026-11-08","time":"15:03","coords":"38.9,-77.0"}
              assert options["timeout"]==12
              return result,options

          def check_openaq(source):
              obj=build_safe(source,"OpenAQ","request")()
              obj.base_url="https://api.openaq.org/v3"
              obj.headers={"X-API-Key":"mock-key"}
              obj.validate_endpoint=lambda s:s
              response=Mock()
              response.url="https://api.openaq.org/v3/locations"
              response.json.return_value={"meta":{},"results":[]}
              requests.get.reset_mock()
              requests.get.return_value=response
              result=obj.request(endpoint="locations",params={"limit":1,"country":None,"blank":""})
              assert result["raw"]==response.json.return_value
              opts=requests.get.call_args.kwargs
              assert opts["url"]=="https://api.openaq.org/v3/locations"
              assert opts["params"]=={"limit":1}
              assert opts["headers"]["X-API-Key"]=="mock-key"
              return result,opts

          def check_firms(source):
              obj=build_safe(source,"Firms","request_csv")()
              obj.map_key="mock-map-key"
              obj.headers={}
              obj.params={"source":"VIIRS"}
              response=Mock()
              response.text="latitude,longitude\n38.9,-77.0"
              requests.get.reset_mock()
              requests.get.return_value=response
              result=obj.request_csv(url="https://firms.modaps.eosdis.nasa.gov/test",time=8)
              assert result["raw"]==response.text
              opts=requests.get.call_args.kwargs
              assert opts["timeout"]==8
              assert opts["url"]==result["url"]
              return result,opts

          for label,checker in [
              ("Google Maps geocoding",check_maps),
              ("US Naval Observatory celnav",check_usno),
              ("OpenAQ air-quality retrieval",check_openaq),
              ("NASA FIRMS CSV retrieval",check_firms),
          ]:
              old=checker(before)
              new=checker(after)
              assert old==new, "API regression in "+label
              print("PASS mocked original-versus-current API contract:",label)

          # Verify all 513 method bodies differ only by intended guard statements,
          # schema's optional required default, and literal quoting of error metadata.
          def method_map(source):
              result = {}
              current_class = ""
              lines = source.splitlines()
              for i, line in enumerate(lines):
                  class_match = re.match(r"^class (\w+)", line)
                  if class_match:
                      current_class = class_match.group(1)
                  method_match = re.match(r"^\tdef (\w+)\(", line)
                  if not method_match:
                      continue
                  end = next((j for j in range(i+1,len(lines))
                              if re.match(r"^(?:\tdef |class )",lines[j])),len(lines))
                  result[(current_class,method_match.group(1))] = lines[i:end]
              return result

          def normalize_method(lines):
              clean=[]
              for line in lines:
                  if re.match(r"^\t{2,3}throw_if\(",line):
                      continue
                  if re.match(r"^\t+exception\.method\s*=",line):
                      line = re.sub(r"^(.*exception\.method\s*=).*$",r"\1 <metadata>",line)
                  line=line.replace("required: list[ str ] | None=None","required: list[ str ]")
                  clean.append(line)
              return "\n".join(clean).rstrip()

          before_map = method_map(before)
          after_map = method_map(after)
          assert before_map.keys()==after_map.keys(), "Public method additions or removals"
          unexpected = []
          for key in before_map:
              a=normalize_method(before_map[key])
              b=normalize_method(after_map[key])
              if a!=b:
                  # Harmless formatting differences must have identical AST.
                  try:
                      x = ast.dump(ast.parse("class Shadow:\n"+a.replace("<metadata>","'metadata'")),include_attributes=False)
                      y = ast.dump(ast.parse("class Shadow:\n"+b.replace("<metadata>","'metadata'")),include_attributes=False)
                      if x == y:
                          continue
                  except SyntaxError:
                      pass
                  import difflib
                  delta = list(difflib.unified_diff(a.splitlines(),b.splitlines(),n=2))
                  unexpected.append((key,delta[:16]))
          print("Methods checked:",len(before_map),"Unexpected non-validation changes:",len(unexpected))
          for name,diff in unexpected[:12]:
              print("MISMATCH",name,"\n"+"\n".join(diff))
          assert not unexpected, "API or response implementation changed outside identified validation and metadata edits"
          print("PASS all provider request and response bodies structurally preserved")

          PY
