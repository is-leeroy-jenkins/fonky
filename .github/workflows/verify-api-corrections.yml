name: Temporary API correction verification
on:
  push:
    paths:
      - '.github/workflows/verify-api-corrections.yml'
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install requests
      - name: Compile and verify UV route construction
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('fetchers.py').read_text(encoding='utf-8')
          ast.parse(source)
          cls=next(x for x in ast.parse(source).body if isinstance(x,ast.ClassDef) and x.name=='UvIndex')
          ctor=next(x for x in cls.body if isinstance(x,ast.FunctionDef) and x.name=='__init__')
          assigned=[x.value.value for x in ast.walk(ctor) if isinstance(x,ast.Assign)
                    and any(isinstance(t,ast.Attribute) and t.attr=='base_url' for t in x.targets)
                    and isinstance(x.value,ast.Constant) and isinstance(x.value.value,str)]
          assert assigned==['https://data.epa.gov/dmapservice'],assigned
          print('PASS UV index constructor base URL and Python syntax')
          PY
      - name: Exercise actual corrected provider methods with mocked responses
        run: |
          python - <<'PY'
          import ast
          import re
          import textwrap
          import urllib.parse
          from pathlib import Path
          from unittest.mock import Mock
          from types import SimpleNamespace
          
          source=Path('fetchers.py').read_text(encoding='utf-8')
          tree=ast.parse(source)
          calls=Mock()
          class AppError(Exception):
              def __init__(self,error):
                  self.exception=error
                  super().__init__(str(error))
          def throw_if(name,value):
              if value is None or isinstance(value,str) and not value.strip():
                  raise ValueError(name)
          def subset(cls_name,method_names):
              cls=next(x for x in tree.body if isinstance(x,ast.ClassDef) and x.name==cls_name)
              body=[]
              for node in cls.body:
                  if isinstance(node,ast.FunctionDef) and node.name in method_names:
                      body.append(textwrap.indent(ast.get_source_segment(source,node),'\t'))
              assert len(body)==len(method_names)
              # ast.get_source_segment includes the original tab indentation for each method.
              env={'Error':AppError,'throw_if':throw_if,'requests':SimpleNamespace(get=calls),
                   'urllib':urllib}
              exec("from __future__ import annotations\nclass Probe:\n"+"\n".join(body),env)
              return env['Probe']
          
          response=Mock()
          response.url='https://example.invalid'
          response.json.return_value=[{'UV_VALUE':'2'}]
          calls.return_value=response
          UV=subset('UvIndex',['request','fetch_daily_zip','fetch_daily_city_state',
                               'fetch_hourly_zip','fetch_hourly_city_state'])
          for method,kwargs,suffix in [
              ('fetch_daily_zip',{'zip_code':'22201'},'/getEnvirofactsUVDAILY/ZIP/22201/JSON'),
              ('fetch_hourly_zip',{'zip_code':'22201'},'/getEnvirofactsUVHOURLY/ZIP/22201/JSON'),
              ('fetch_daily_city_state',{'city':'washington','state':'dc'},
               '/getEnvirofactsUVDAILY/CITY/washington/STATE/dc/JSON'),
              ('fetch_hourly_city_state',{'city':'washington','state':'dc'},
               '/getEnvirofactsUVHOURLY/CITY/washington/STATE/dc/JSON')
          ]:
              inst=UV()
              inst.base_url='https://data.epa.gov/dmapservice'
              inst.headers={}
              inst.validate_zip_code=lambda x:x
              inst.validate_city=lambda x:x
              inst.validate_state=lambda x:x
              inst.shape_rows=lambda x:x
              inst.package_response=lambda x:{'rows':x}
              calls.reset_mock()
              result=getattr(inst,method)(**kwargs)
              assert calls.call_args.kwargs['url'].endswith(suffix),method
              assert calls.call_args.kwargs['timeout']==20,method
              assert result['rows']==response.json.return_value,method
              print('PASS actual UvIndex method, mocked API response:',method)
          
          ScienceBase=subset('USGSScienceBase',['request','fetch_items'])
          sb=ScienceBase()
          sb.base_url='https://www.sciencebase.gov/catalog'
          sb.headers={'Accept':'application/json'}
          sb.validate_endpoint=lambda x:x
          sb.validate_max_items=lambda x:x
          sb.validate_offset=lambda x:x
          sb.coalesce_records=lambda payload: payload.get('items',[])
          sb.shape_item_rows=lambda items: items
          sb.package_response=lambda items: {'rows':items}
          response.json.return_value={'items':[{'id':'demo'}]}
          calls.reset_mock()
          result=sb.fetch_items()
          assert calls.call_args.kwargs['url']=='https://www.sciencebase.gov/catalog/items'
          assert calls.call_args.kwargs['params']=={'q':'','max':25,'offset':0}
          assert result['rows']==response.json.return_value['items']
          print('PASS actual ScienceBase.fetch_items() retains the required q= query')
          
          PY
      - name: Probe corrected UV routes and ScienceBase searches
        run: |
          python - <<'PY'
          import requests
          from concurrent.futures import ThreadPoolExecutor
          checks=[
            ('UV daily ZIP','https://data.epa.gov/dmapservice/getEnvirofactsUVDAILY/ZIP/22201/JSON'),
            ('UV hourly ZIP','https://data.epa.gov/dmapservice/getEnvirofactsUVHOURLY/ZIP/22201/JSON'),
            ('UV daily city','https://data.epa.gov/dmapservice/getEnvirofactsUVDAILY/CITY/washington/STATE/dc/JSON'),
            ('UV hourly city','https://data.epa.gov/dmapservice/getEnvirofactsUVHOURLY/CITY/washington/STATE/dc/JSON'),
            ('USGS ScienceBase query','https://www.sciencebase.gov/catalog/items?q=bison&format=json&max=5'),
            ('USGS ScienceBase empty q','https://www.sciencebase.gov/catalog/items?q=&format=json&max=5'),
            ('USGS ScienceBase omitted q','https://www.sciencebase.gov/catalog/items?format=json&max=25'),
            ('USGS ScienceBase corrected default','https://www.sciencebase.gov/catalog/items?q=&max=25&offset=0'),
            ('ScienceBase json with offset0','https://www.sciencebase.gov/catalog/items?q=&format=json&max=25&offset=0'),
            ('ScienceBase json without offset','https://www.sciencebase.gov/catalog/items?q=&format=json&max=25'),
            ('ScienceBase json with offset5','https://www.sciencebase.gov/catalog/items?q=&format=json&max=25&offset=5'),
            ('ScienceBase text format absent','https://www.sciencebase.gov/catalog/items?q=&max=5')
          ]
          def verify(c):
              name,url=c
              try:
                  response=requests.get(url,timeout=20)
                  try:
                      payload=response.json()
                      shape=type(payload).__name__
                      summary=repr(payload)[:100]
                  except ValueError:
                      shape='non-json'
                      summary=response.text[:100]
                  return (name,response.status_code,shape,summary,response.url)
              except Exception as exc:
                  return (name,type(exc).__name__,str(exc)[:100])
          with ThreadPoolExecutor(max_workers=5) as pool:
              results=list(pool.map(verify,checks))
          for item in results:
              print(repr(item))
          if any(not isinstance(item[1],int) or item[1]>=400 or item[2] not in ('list','dict')
                 for item in results[:4]):
              raise SystemExit('At least one corrected EPA UV route failed')
          print('PASS four live corrected EPA UV Index API routes')
          PY
