name: Verify Census and NASA DONKI requests

on:
  pull_request:
    paths:
      - "fetchers.py"
      - "tests/test_census_donki.py"
      - ".github/workflows/test-census-donki.yml"
  workflow_dispatch:

jobs:
  census-donki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated test dependency
        run: python -m pip install pytest
      - name: Verify syntax and API request contracts
        run: |
          python -m py_compile fetchers.py
          python -m pytest -q tests/test_census_donki.py
