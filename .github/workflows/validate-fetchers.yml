name: Validate Fonky fetchers

on:
  push:
    paths:
      - 'fetchers.py'
      - '.github/workflows/validate-fetchers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile fetchers
        run: python -m py_compile fetchers.py

      - name: Verify shared fetcher contracts
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path('fetchers.py').read_text(encoding='utf-8')
          tree = ast.parse(source, filename='fetchers.py')
          classes = [node for node in tree.body if isinstance(node, ast.ClassDef)]
          methods = [
              (cls.name, member.name)
              for cls in classes
              for member in cls.body
              if isinstance(member, (ast.FunctionDef, ast.AsyncFunctionDef))
          ]
          assert len(classes) == 49, f'Unexpected class count: {len(classes)}'
          assert len(methods) == 477, f'Unexpected method count: {len(methods)}'
          assert methods.count(('Fetcher', 'create_schema')) == 1
          assert sum(name == 'create_schema' for _, name in methods) == 1
          assert 'getattr(' not in source and 'hasattr(' not in source
          assert not any(
              isinstance(node, ast.arguments) and
              (node.vararg is not None or node.kwarg is not None)
              for node in ast.walk(tree)
          ), 'Variadic method parameters violate the project conventions'
          print('Fetcher source contracts passed.')
          PY
