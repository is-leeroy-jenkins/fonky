name: Test AstroCatalog replacement

on:
  pull_request:
    paths:
      - "fetchers.py"
      - "tests/test_astrocatalog.py"
      - ".github/workflows/test-astrocatalog.yml"
  workflow_dispatch:

jobs:
  test-astrocatalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install focused test dependencies
        run: python -m pip install pytest numpy
      - name: Compile fetchers and test catalog behavior
        run: |
          python -m py_compile fetchers.py
          python -m pytest -q tests/test_astrocatalog.py
